name: AMEE
description: >-
  AMEE (Avoiding Mass Extinctions Engine, also styled Avoidance of Mass
  Extinctions Engine) was a London-based environmental-intelligence company
  founded around 2005 by Gavin Starks out of UK firm Dgen. It ran an open
  web-service API and cloud database that standardized carbon-emissions and
  energy-consumption data across 150+ countries, letting applications apply
  government emission factors to tracked activities. AMEE powered carbon
  calculators and footprinting for clients including Google, Morgan Stanley,
  Radiohead, Sun Microsystems, and UK and Irish government programs (notably the
  Act on CO2 campaign). It raised roughly $7.5M from Union Square Ventures, OATV
  (O'Reilly AlphaTech Ventures), The Accelerator Group, and Amadeus Capital
  Partners. AMEE was acquired by Pi (PredictX) in late 2015 / early 2016 and no
  longer operates as an independent company; the amee.com domain currently
  returns HTTP 502 with no live API or developer surface.
